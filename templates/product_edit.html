{% extends "base.html" %}

{% block title %}Редактирование | {{ product.name }}{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Каталог</a></li>
        <li class="breadcrumb-item"><a href="/products/{{ product.id }}">{{ product.name }}</a></li>
        <li class="breadcrumb-item active">Редактирование</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4">
            <h3 class="fw-bold mb-2"><i class="bi bi-pencil-square text-primary me-2"></i>Редактирование товара</h3>
            <p class="text-muted mb-4">Изменение данных и спецификаций в карточке товара</p>

            <form method="POST" action="/admin/products/{{ product.id }}/edit">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Артикул (SKU)</label>
                        <input type="text" name="sku" class="form-control" value="{{ product.sku }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Название модели</label>
                        <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Бренд</label>
                        <input type="text" name="brand" class="form-control" value="{{ product.brand }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Категория</label>
                        <input type="text" name="category" class="form-control" value="{{ product.category }}" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Цена (руб.)</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Описание товара</label>
                        <textarea name="description" class="form-control" rows="3" required>{{ product.description }}</textarea>
                    </div>

                    <div class="col-12 mt-4">
                        <h5 class="fw-bold border-bottom pb-2">Технические характеристики</h5>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small text-muted">Экран / Дисплей</label>
                        <input type="text" name="spec_screen" class="form-control" value="{{ (product.specifications or {}).get('Экран', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Процессор</label>
                        <input type="text" name="spec_cpu" class="form-control" value="{{ (product.specifications or {}).get('Процессор', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Оперативная память</label>
                        <input type="text" name="spec_ram" class="form-control" value="{{ (product.specifications or {}).get('Оперативная память', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Встроенная память</label>
                        <input type="text" name="spec_storage" class="form-control" value="{{ (product.specifications or {}).get('Встроенная память', '') }}">
                    </div>

                    <div class="col-12 mt-4 d-flex justify-content-between">
                        <a href="/products/{{ product.id }}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i>Сохранить изменения
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
